<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories — My Expenses</title>
  <link rel="stylesheet" href="/theme.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
    }
    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      padding-bottom: 32px;
    }
    .color-circle {
      cursor: pointer;
      transition: all 0.2s;
    }
    .color-circle.active {
      transform: scale(1.1);
      box-shadow: 0 0 0 2px var(--color-bg), 0 0 0 4px currentColor;
    }
    .icon-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      width: max-content;
      max-width: 200px;
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: var(--radius);
      padding: 0.5rem;
      z-index: 10;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      flex-wrap: wrap;
      gap: 0.25rem;
    }
    .icon-dropdown.show {
      display: flex;
    }
    .icon-option {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      cursor: pointer;
      border-radius: 8px;
    }
    .icon-option:hover {
      background: var(--color-bg);
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="px-5 pt-8 pb-5 flex items-center gap-4">
      <a href="/" class="w-10 h-10 rounded-full bg-[var(--color-surface)] border border-[var(--color-line)] grid place-items-center text-xl">←</a>
      <div class="flex-1">
        <p class="text-xs text-[var(--color-muted)]">MAKE IT YOURS</p>
        <h1 class="text-xl font-bold">Categories</h1>
      </div>
      <button id="editBtn" class="text-sm font-semibold text-[var(--color-primary)]">Edit</button>
    </header>
    
    <div class="px-5">
      <section class="bg-[#eaf1e5] rounded-[var(--radius)] p-5 mb-6">
        <div class="flex justify-between">
          <div>
            <p class="text-sm text-[var(--color-muted)]">PERSONALIZE YOUR TRACKING</p>
            <h2 class="text-xl font-bold mt-1">Your spending,<br>your categories.</h2>
          </div>
          <span class="text-4xl">✳</span>
        </div>
        <p class="text-xs text-[var(--color-muted)] mt-3">Add a category for anything you want to keep an eye on.</p>
      </section>

      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-lg">Your categories <span id="categoryCount" class="text-xs text-[var(--color-muted)] font-medium">0</span></h2>
        <span class="text-xs text-[var(--color-muted)]">Sorted by most used</span>
      </div>
      
      <div id="categoryList" class="space-y-2 mb-8">
        <div id="loadingCategories" class="text-center py-4 text-sm text-[var(--color-muted)]">Loading...</div>
      </div>

      <section class="mt-5 bg-[var(--color-surface)] border border-dashed border-[#b7c4b9] rounded-[var(--radius)] p-4 relative">
        <div class="flex justify-between items-center mb-4">
          <div>
            <h2 class="font-bold">Create a category</h2>
            <p class="text-xs text-[var(--color-muted)] mt-1">Add a label that feels like you.</p>
          </div>
          <span class="text-2xl">✨</span>
        </div>
        
        <label class="block text-xs font-semibold mb-2">CATEGORY NAME</label>
        <input id="catName" type="text" placeholder="e.g. College Expenses" class="w-full px-4 py-3 rounded-xl bg-[var(--color-bg)] border border-[var(--color-line)] text-sm outline-none" />
        
        <div class="flex gap-3 mt-3 relative">
          <div class="flex-1 relative">
            <label class="block text-xs font-semibold mb-2">PICK AN ICON</label>
            <div id="iconPickerToggle" class="bg-[var(--color-bg)] border border-[var(--color-line)] rounded-xl px-3 py-2.5 text-xl flex justify-between items-center cursor-pointer">
              <span id="selectedIconDisplay">🎓</span>
              <span class="text-sm">⌄</span>
            </div>
            <div id="iconDropdown" class="icon-dropdown">
              <!-- Icons will be injected here -->
            </div>
          </div>
          <div class="flex-1">
            <label class="block text-xs font-semibold mb-2">CATEGORY COLOR</label>
            <div id="colorContainer" class="bg-[var(--color-bg)] border border-[var(--color-line)] rounded-xl px-3 py-3 flex gap-2 flex-wrap">
              <!-- Colors injected here -->
            </div>
          </div>
        </div>
        
        <button id="saveCatBtn" class="w-full mt-4 py-3 rounded-xl bg-[var(--color-primary)] text-[var(--color-primary-contrast)] text-sm font-bold">＋ Save category</button>
      </section>
      
      <a href="/add-expense" class="mt-5 block text-center py-3 text-sm font-semibold text-[var(--color-primary)]">Use a category in an expense →</a>
    </div>
  </main>

  <!-- Supabase & App JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  
  <script>
    const icons = ['🍛','🚍','🛒','💡','🎓','🎬','🏠','💊','🎮','📱','👕','🎁','💰','🏋️','📚','☕','🍕','🎵','🐾','✈️','💻','🎨','🔧','⚽'];
    const colors = ['#176b55', '#d8a269', '#bd8bb4', '#829fcb', '#e9a37d', '#c5d76d', '#d94f4f', '#5b8c7a'];
    
    let selectedIcon = icons[0];
    let selectedColor = colors[0];
    let isEditMode = false;
    let cachedCategories = [];
    let expensesByCat = {};
    
    const categoryList = document.getElementById('categoryList');
    const categoryCount = document.getElementById('categoryCount');
    const loadingCategories = document.getElementById('loadingCategories');
    const editBtn = document.getElementById('editBtn');
    
    const catName = document.getElementById('catName');
    const saveCatBtn = document.getElementById('saveCatBtn');
    const iconPickerToggle = document.getElementById('iconPickerToggle');
    const selectedIconDisplay = document.getElementById('selectedIconDisplay');
    const iconDropdown = document.getElementById('iconDropdown');
    const colorContainer = document.getElementById('colorContainer');
    
    async function init() {
      renderPickers();
      await reloadCategories();
      
      subscribeCategories(() => reloadCategories());
      subscribeExpenses(() => reloadCategories());
    }

    async function reloadCategories() {
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth() + 1;
      
      try {
        const [categories, monthExpenses] = await Promise.all([
          fetchCategories(),
          fetchExpenses(monthStartStr(y, m), monthEndStr(y, m))
        ]);
        
        cachedCategories = categories || [];
        
        expensesByCat = {};
        (monthExpenses || []).forEach(exp => {
          if (!expensesByCat[exp.category_id]) {
            expensesByCat[exp.category_id] = { count: 0, total: 0 };
          }
          expensesByCat[exp.category_id].count++;
          expensesByCat[exp.category_id].total += parseFloat(exp.amount || 0);
        });
        
        renderCategories();
      } catch (err) {
        console.error("Error loading categories", err);
        showToast("Error loading categories", "error");
      }
    }
    
    function renderCategories() {
      if (loadingCategories) loadingCategories.remove();
      
      cachedCategories.sort((a, b) => {
        const countA = expensesByCat[a.id]?.count || 0;
        const countB = expensesByCat[b.id]?.count || 0;
        return countB - countA;
      });
      
      categoryCount.textContent = cachedCategories.length;
      
      if (cachedCategories.length === 0) {
        categoryList.innerHTML = \`<p class="text-sm text-center text-[var(--color-muted)] py-4">No categories yet.</p>\`;
        return;
      }
      
      categoryList.innerHTML = cachedCategories.map(cat => {
        const stats = expensesByCat[cat.id] || { count: 0, total: 0 };
        const bgColor = cat.color + '20'; // 20% opacity hex
        
        return \`
          <article class="flex items-center gap-3 bg-[var(--color-surface)] rounded-2xl border border-[var(--color-line)] p-3.5">
            <span class="w-11 h-11 rounded-2xl grid place-items-center text-xl" style="background-color: \${bgColor}; color: \${cat.color};">\${cat.icon}</span>
            <div class="flex-1">
              <b class="text-sm">\${cat.name}</b>
              <p class="text-xs text-[var(--color-muted)] mt-0.5">\${stats.count} expenses this month</p>
            </div>
            <div class="text-right">
              <b class="text-sm">₹\${formatCurrency(stats.total)}</b>
              <p class="text-xs text-[var(--color-muted)]">this month</p>
            </div>
            \${isEditMode 
              ? \`<button onclick="handleDelete('\${cat.id}')" class="w-8 h-8 flex items-center justify-center text-red-500 rounded-full hover:bg-red-50 ml-1">🗑</button>\`
              : \`<button onclick="handleAction('\${cat.id}')" class="text-[var(--color-muted)] ml-1 w-8 h-8 flex items-center justify-center">⋯</button>\`
            }
          </article>
        \`;
      }).join('');
    }
    
    function renderPickers() {
      iconDropdown.innerHTML = icons.map(icon => \`<div class="icon-option" onclick="selectIcon('\${icon}')">\${icon}</div>\`).join('');
      
      colorContainer.innerHTML = colors.map(color => \`
        <i class="w-5 h-5 rounded-full color-circle" style="background-color: \${color}; color: \${color};" onclick="selectColor('\${color}', this)"></i>
      \`).join('');
      
      selectIcon(icons[0]);
      selectColor(colors[0], colorContainer.firstElementChild);
    }
    
    window.selectIcon = function(icon) {
      selectedIcon = icon;
      selectedIconDisplay.textContent = icon;
      iconDropdown.classList.remove('show');
    };
    
    window.selectColor = function(color, el) {
      selectedColor = color;
      document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('active'));
      if (el) el.classList.add('active');
    };
    
    iconPickerToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      iconDropdown.classList.toggle('show');
    });
    
    document.addEventListener('click', () => {
      iconDropdown.classList.remove('show');
    });
    
    editBtn.addEventListener('click', () => {
      isEditMode = !isEditMode;
      editBtn.textContent = isEditMode ? 'Done' : 'Edit';
      renderCategories();
    });
    
    window.handleAction = function(id) {
      if (confirm('Delete this category?')) {
        handleDelete(id);
      }
    };
    
    window.handleDelete = async function(id) {
      try {
        await removeCategory(id);
        showToast('Category deleted', 'success');
      } catch (e) {
        showToast('Error deleting category', 'error');
      }
    };
    
    saveCatBtn.addEventListener('click', async () => {
      const name = catName.value.trim();
      if (!name) {
        showToast('Category name is required', 'error');
        return;
      }
      
      const originalText = saveCatBtn.textContent;
      saveCatBtn.textContent = 'Saving...';
      saveCatBtn.disabled = true;
      
      try {
        await insertCategory({ name, icon: selectedIcon, color: selectedColor });
        showToast('Category created!', 'success');
        catName.value = '';
      } catch (err) {
        showToast('Error creating category', 'error');
      } finally {
        saveCatBtn.textContent = originalText;
        saveCatBtn.disabled = false;
      }
    });
    
    init();
  </script>
</body>
</html>
