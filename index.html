<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Expenses — Overview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
    }

    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: var(--color-bg);
      position: relative;
      padding-bottom: 96px;
    }

    .soft-shadow {
      box-shadow: 0 12px 30px rgba(29, 54, 39, .07);
    }

    .nav-item {
      color: var(--color-muted);
    }

    .nav-item.active {
      color: var(--color-primary);
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="px-6 pt-8 pb-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-[var(--color-primary)] text-[var(--color-primary-contrast)] grid place-items-center text-xl font-bold">m</div>
        <div>
          <p id="header-date" class="text-xs text-[var(--color-muted)] font-medium">MONDAY, OCTOBER 19</p>
          <h1 id="header-greeting" class="text-xl font-bold tracking-tight">Good morning, Maya</h1>
        </div>
      </div>
      <button aria-label="Notifications" class="w-11 h-11 bg-[var(--color-surface)] rounded-full grid place-items-center border border-[var(--color-line)] text-lg">⌑<span class="absolute ml-5 -mt-5 w-2 h-2 rounded-full bg-[#eb7a56]"></span></button>
    </header>

    <section class="mx-5 rounded-[var(--radius)] bg-[var(--color-primary)] p-6 text-[var(--color-primary-contrast)] soft-shadow overflow-hidden relative">
      <div class="absolute -right-9 -top-10 w-40 h-40 rounded-full border-[22px] border-white/10"></div>
      <div class="relative">
        <div class="flex justify-between items-center">
          <p class="text-sm text-white/75">Total spent today</p><span class="rounded-full bg-white/15 px-3 py-1 text-xs">Today⌄</span>
        </div>
        <p id="today-total" class="text-[38px] leading-tight font-bold tracking-tight mt-2">₹ 0<span class="text-xl">.00</span></p>
        <div id="today-comparison" class="mt-5 flex items-center gap-2 text-xs text-white/80">
          <!-- Populated dynamically -->
        </div>
      </div>
    </section>

    <section class="px-5 mt-5 grid grid-cols-2 gap-3">
      <article class="bg-[var(--color-surface)] rounded-[var(--radius)] p-4 border border-[var(--color-line)]">
        <div class="flex items-center justify-between"><span class="text-[11px] text-[var(--color-muted)]">THIS MONTH</span><span class="text-lg">◷</span></div>
        <p id="month-total" class="font-bold text-[22px] mt-2">₹0</p>
        <p id="month-budget-text" class="text-xs text-[var(--color-muted)] mt-1">of ₹15,000 budget</p>
        <div class="h-1.5 bg-[#edf0ea] rounded-full mt-3 overflow-hidden">
          <div id="month-progress" class="w-[0%] h-full bg-[var(--color-primary)] rounded-full transition-all duration-500"></div>
        </div>
      </article>
      <article class="bg-[#eef4df] rounded-[var(--radius)] p-4 border border-[#e5edcf]">
        <div class="flex items-center justify-between"><span class="text-[11px] text-[var(--color-muted)]">LEFT TO SPEND</span><span class="text-lg">✳</span></div>
        <p id="left-to-spend" class="font-bold text-[22px] mt-2">₹0</p>
        <p id="left-msg" class="text-xs text-[var(--color-muted)] mt-1">You’re right on track</p>
        <div id="left-to-spend-dots" class="flex gap-1 mt-3">
          <!-- Populated dynamically -->
        </div>
      </article>
    </section>

    <section class="px-5 mt-7">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold text-lg">Quick add</h2><a href="/add-expense" class="text-sm font-semibold text-[var(--color-primary)]">Custom +</a>
      </div>
      <div id="quick-add-container" class="grid grid-cols-3 gap-2.5">
        <!-- Populated dynamically -->
      </div>
    </section>

    <section class="px-5 mt-7">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold text-lg">Spending by category</h2><a href="/reports" class="text-sm font-semibold text-[var(--color-primary)]">See report</a>
      </div>
      <article class="bg-[var(--color-surface)] rounded-[var(--radius)] p-4 border border-[var(--color-line)]">
        <div class="flex items-center gap-4">
          <div id="chart-container" class="relative w-[100px] h-[100px] shrink-0 rounded-full transition-all duration-500" style="background:conic-gradient(#e5edcf 0 100%)">
            <div class="absolute inset-[13px] rounded-full bg-[var(--color-surface)] grid place-content-center text-center"><b id="chart-total" class="text-sm">₹0</b><span id="chart-month" class="text-[9px] text-[var(--color-muted)]">MONTH</span></div>
          </div>
          <div id="chart-legend" class="flex-1 space-y-2.5 text-xs">
             <!-- Populated dynamically -->
          </div>
        </div>
      </article>
    </section>

    <section class="px-5 mt-7">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-lg">Recent transactions</h2><a href="/reports" class="text-sm font-semibold text-[var(--color-primary)]">View all</a>
      </div>
      <div id="recent-transactions" class="bg-[var(--color-surface)] rounded-[var(--radius)] border border-[var(--color-line)] divide-y divide-[var(--color-line)]">
        <!-- Populated dynamically -->
      </div>
    </section>

    <a href="/add-expense" aria-label="Add expense" class="fixed bottom-[82px] right-[max(24px,calc((100vw-390px)/2+24px))] w-14 h-14 rounded-2xl bg-[var(--color-primary)] text-[var(--color-primary-contrast)] text-3xl font-light grid place-items-center shadow-lg">+</a>
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-[var(--color-surface)] border-t border-[var(--color-line)] px-7 py-3 flex justify-between z-10">
      <a class="nav-item active flex flex-col items-center gap-1 text-[10px] font-semibold" href="/"><span class="text-xl">⌂</span>Home</a>
      <a class="nav-item flex flex-col items-center gap-1 text-[10px] font-semibold" href="/reports"><span class="text-xl">▥</span>Reports</a>
      <a class="nav-item flex flex-col items-center gap-1 text-[10px] font-semibold" href="/add-expense"><span class="text-xl">＋</span>Add</a>
      <a class="nav-item flex flex-col items-center gap-1 text-[10px] font-semibold" href="/categories"><span class="text-xl">◉</span>Categories</a>
    </nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let currentExpenses = [];
    let currentCategories = [];

    async function loadDashboard() {
      try {
        document.getElementById('header-date').textContent = getDayLabel();
        document.getElementById('header-greeting').textContent = getGreeting();

        const today = todayStr();
        
        const todayExpenses = await fetchExpenses(today, today);
        const todayTotal = todayExpenses.reduce((sum, exp) => sum + Number(exp.amount), 0);
        
        const [intPart, decPart] = formatCurrency(todayTotal).split('.');
        document.getElementById('today-total').innerHTML = \`₹ \${intPart}<span class="text-xl">.\${decPart || '00'}</span>\`;

        const d = new Date();
        const y = d.getFullYear();
        const m = d.getMonth() + 1;
        const start = monthStartStr(y, m);
        const end = monthEndStr(y, m);
        
        const monthExpenses = await fetchExpenses(start, end);
        const monthTotal = monthExpenses.reduce((sum, exp) => sum + Number(exp.amount), 0);
        currentExpenses = monthExpenses;
        
        const daysElapsed = d.getDate();
        const dailyAvg = monthTotal / daysElapsed;
        
        const compEl = document.getElementById('today-comparison');
        if (dailyAvg > 0) {
          const diff = todayTotal - dailyAvg;
          const pct = Math.round(Math.abs(diff) / dailyAvg * 100);
          if (todayTotal <= dailyAvg) {
            compEl.innerHTML = \`<span class="bg-[var(--color-accent)] text-[var(--color-text)] rounded-full px-2 py-1 font-bold">↓ \${pct}%</span><span>less than your daily average</span>\`;
          } else {
            compEl.innerHTML = \`<span class="bg-[#fde2e2] text-[#c92a2a] rounded-full px-2 py-1 font-bold">↑ \${pct}%</span><span>more than your daily average</span>\`;
          }
        } else {
          compEl.innerHTML = \`<span>No daily average data yet</span>\`;
        }

        document.getElementById('month-total').textContent = \`₹\${formatCurrency(monthTotal)}\`;
        document.getElementById('month-budget-text').textContent = \`of ₹\${formatCurrency(BUDGET)} budget\`;
        let pctMonth = (monthTotal / BUDGET) * 100;
        if (pctMonth > 100) pctMonth = 100;
        document.getElementById('month-progress').style.width = \`\${pctMonth}%\`;
        
        const leftToSpend = BUDGET - monthTotal;
        document.getElementById('left-to-spend').textContent = \`₹\${formatCurrency(leftToSpend)}\`;
        
        let dotsHtml = '';
        const dotsCount = Math.round((leftToSpend / BUDGET) * 5);
        for (let i = 0; i < 5; i++) {
          if (i < Math.max(0, dotsCount)) {
            dotsHtml += \`<span class="w-5 h-1.5 rounded-full bg-[var(--color-primary)]"></span>\`;
          } else {
            dotsHtml += \`<span class="w-5 h-1.5 rounded-full bg-[#cdd8bd]"></span>\`;
          }
        }
        document.getElementById('left-to-spend-dots').innerHTML = dotsHtml;
        
        const leftMsg = document.getElementById('left-msg');
        if (leftToSpend < 0) leftMsg.textContent = "Over budget!";
        else if (leftToSpend < BUDGET * 0.2) leftMsg.textContent = "Almost out of budget";
        else leftMsg.textContent = "You’re right on track";

        const categories = await fetchCategories();
        currentCategories = categories;
        const quickAddEl = document.getElementById('quick-add-container');
        
        const quickAddAmts = { 'Tiffin': 20, 'Travel': 50, 'Food': 100 };
        
        quickAddEl.innerHTML = categories.slice(0, 3).map(c => {
          const amt = quickAddAmts[c.name] || 50;
          return \`<button onclick="quickAdd('\${c.id}', \${amt})" class="bg-[var(--color-surface)] rounded-2xl border border-[var(--color-line)] p-3 text-center hover:border-[var(--color-primary)] w-full text-left flex flex-col items-center">
            <span class="text-xl">\${c.icon}</span>
            <p class="text-xs font-semibold mt-1">\${c.name}</p>
            <p class="text-xs text-[var(--color-muted)]">₹\${amt}</p>
          </button>\`;
        }).join('');

        const catTotals = {};
        monthExpenses.forEach(e => {
          catTotals[e.category_id] = (catTotals[e.category_id] || 0) + Number(e.amount);
        });
        
        const chartData = categories.filter(c => catTotals[c.id]).map(c => ({
          ...c,
          total: catTotals[c.id],
          pct: (catTotals[c.id] / monthTotal) * 100
        })).sort((a,b) => b.total - a.total);

        let gradientParts = [];
        let currentPct = 0;
        let legendHtml = '';
        
        chartData.forEach(c => {
          let nextPct = currentPct + c.pct;
          gradientParts.push(\`\${c.color} \${currentPct}% \${nextPct}%\`);
          currentPct = nextPct;
          
          legendHtml += \`<div class="flex justify-between"><span class="flex gap-2 items-center"><i class="w-2 h-2 rounded-full" style="background:\${c.color}"></i>\${c.name}</span><b>₹\${formatCurrency(c.total)}</b></div>\`;
        });
        
        const donutGradient = gradientParts.length > 0 ? \`conic-gradient(\${gradientParts.join(', ')})\` : \`conic-gradient(#e5edcf 0 100%)\`;
        
        document.getElementById('chart-container').style.background = donutGradient;
        document.getElementById('chart-total').textContent = \`₹\${formatCurrency(monthTotal)}\`;
        document.getElementById('chart-month').textContent = d.toLocaleString('default', { month: 'long' }).toUpperCase();
        document.getElementById('chart-legend').innerHTML = legendHtml || \`<p class="text-xs text-[var(--color-muted)]">No expenses yet</p>\`;
        
        const recent = [...monthExpenses].sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 5);
        const recentEl = document.getElementById('recent-transactions');
        
        if (recent.length === 0) {
          recentEl.innerHTML = \`<div class="p-4 text-center text-sm text-[var(--color-muted)]">No recent transactions</div>\`;
        } else {
          recentEl.innerHTML = recent.map(r => {
            let cat = categories.find(c => c.id === r.category_id);
            if(!cat) cat = {name: 'Unknown', icon: '❓', color: '#ccc'};
            return \`<div class="flex items-center px-4 py-3.5 gap-3 group relative">
              <span class="w-10 h-10 rounded-2xl grid place-items-center" style="background:\${cat.color}20">\${cat.icon}</span>
              <div class="flex-1">
                <p class="text-sm font-semibold">\${r.description || cat.name}</p>
                <p class="text-xs text-[var(--color-muted)]">\${cat.name} · \${r.payment_method.toUpperCase()} · \${formatTime(r.created_at)}</p>
              </div>
              <b class="text-sm">−₹\${formatCurrency(r.amount)}</b>
              <button onclick="deleteTx('\${r.id}')" class="absolute right-2 opacity-0 group-hover:opacity-100 bg-red-100 text-red-600 rounded-full w-6 h-6 flex items-center justify-center font-bold text-xs transition-opacity" title="Delete">×</button>
            </div>\`;
          }).join('');
        }
      } catch (err) {
        console.error(err);
        if(typeof showToast === 'function') showToast('Error loading dashboard', 'error');
      }
    }

    async function quickAdd(categoryId, amount) {
      try {
        await insertExpense({
          amount: amount,
          description: '',
          category_id: categoryId,
          date: todayStr(),
          payment_method: 'upi'
        });
        if(typeof showToast === 'function') showToast('Added!', 'success');
      } catch (err) {
        if(typeof showToast === 'function') showToast('Failed to add expense', 'error');
      }
    }

    async function deleteTx(id) {
      if (confirm('Delete this transaction?')) {
        try {
          await removeExpense(id);
          if(typeof showToast === 'function') showToast('Deleted', 'success');
        } catch(err) {
          if(typeof showToast === 'function') showToast('Failed to delete', 'error');
        }
      }
    }

    // Initialize subscriptions and load
    document.addEventListener('DOMContentLoaded', () => {
      loadDashboard();
      
      if (typeof subscribeExpenses === 'function') {
        subscribeExpenses(() => loadDashboard());
      }
      if (typeof subscribeCategories === 'function') {
        subscribeCategories(() => loadDashboard());
      }
    });
  </script>
</body>

</html>
